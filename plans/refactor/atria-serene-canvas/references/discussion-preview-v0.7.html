<body>
<header class="tools" aria-label="Design preview controls"><strong>Serene Canvas · v0.7</strong><select id="view" aria-label="Preview page"></select><select id="language" aria-label="Language"><option value="zh-cn">简体中文</option><option value="en">English</option></select><select id="sample" aria-label="Example state"></select><a href="discussion-preview-v0.6.html" id="previous-link"></a></header>
<div class="preview-note" id="preview-note"></div>
<nav class="dock" aria-label="Primary navigation"><span class="brand" aria-hidden="true">O</span><button data-scene="play" aria-label="Play">▷</button><button data-scene="library" aria-label="Library">▥</button><button data-view="home" aria-label="Studio">☆</button><button data-scene="agents" aria-label="Agents">✧</button><button data-scene="runtime" aria-label="Runtime">⚙</button><button data-view="account" aria-label="Account">◎</button></nav>
<main class="frame" id="main"></main>
<dialog id="review" aria-labelledby="review-title"><div class="dialog-paper"><header class="dialog-header"><h2 id="review-title"></h2><button id="close-review"></button></header><div id="review-body"></div></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module">
// Design-only state. No product service requests, credentials or durable writes.
const main=document.querySelector('#main'), review=document.querySelector('#review');
let locale='zh-cn', view='home', sample='default', returnFocus=null, inputMode='pointer', toastTimer, dialogAnimation, dialogSequence=0;
let agentPhase='draft', agentIntent='Give the harbour keeper a quieter introduction.', fileDraft='<template>\n  <main node-id="root">\n    <p node-id="welcome">The harbour is quiet.</p>\n  </main>\n</template>', loginPhase='account';
const t=(en,zh)=>locale==='en'?en:zh;
const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const pages=()=>[['home',t('Studio projects','创作项目')],['agent',t('Project Agent','项目助手')],['files',t('Source files','源码文件')],['login',t('Sign in','登录')],['account',t('Account & backup','账户与备份')],['backup',t('Backup & sync','备份与同步')],['extensions',t('Extensions','扩展')],['media',t('Illustration review','插图审查')],['host',t('Work interface & host','作品界面与恢复')],['previous',t('Complete v0.6 discussion','v0.6 完整讨论稿')]];
const button=(label,action,kind='',disabled=false)=>`<button type="button" class="${kind}" data-action="${action}"${disabled?' disabled':''}>${label}</button>`;
const field=(label,control)=>`<label><span>${label}</span>${control}</label>`;
const heading=(title,description,action='')=>`<div class="heading"><div><h1>${title}</h1><p class="muted">${description}</p></div>${action}</div>`;
const details=(label,body)=>`<details><summary>${label}</summary>${body}</details>`;
const info=(en,zh,error=false)=>`<p class="notice${error?' error':''}">${t(en,zh)}</p>`;
const technical=(data)=>`<pre translate="no">${esc(JSON.stringify(data,null,2))}</pre>`;
function toast(en,zh){const el=document.querySelector('#toast');clearTimeout(toastTimer);el.textContent=t(en,zh);el.hidden=false;toastTimer=setTimeout(()=>{el.hidden=true;},3600);}
function openReview(title,body){
  const paper=review.querySelector('.dialog-paper'), alreadyOpen=review.open;
  const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const from=alreadyOpen?{opacity:getComputedStyle(paper).opacity,transform:getComputedStyle(paper).transform}:{opacity:0,transform:reduced?'none':'translateY(12px)'};
  const sequence=++dialogSequence;dialogAnimation?.cancel();if(!alreadyOpen)returnFocus=document.activeElement;
  document.querySelector('#review-title').textContent=title;document.querySelector('#review-body').innerHTML=body;document.querySelector('#close-review').textContent=t('Close','关闭');
  if(!alreadyOpen)review.showModal();
  if(inputMode!=='keyboard'){
    dialogAnimation=paper.animate([from,{opacity:1,transform:'none'}],{duration:reduced?100:240,easing:'cubic-bezier(.22,1,.36,1)',fill:'both'});
    dialogAnimation.finished.then(()=>{if(sequence===dialogSequence)dialogAnimation?.cancel();}).catch(()=>{});
  }
  document.querySelector('#close-review').focus();
}
async function closeReview(){
  const paper=review.querySelector('.dialog-paper'),sequence=++dialogSequence;
  const from={opacity:getComputedStyle(paper).opacity,transform:getComputedStyle(paper).transform};dialogAnimation?.cancel();
  if(inputMode!=='keyboard'){
    const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
    dialogAnimation=paper.animate([from,{opacity:0,transform:reduced?'none':'translateY(12px)'}],{duration:reduced?100:180,easing:'cubic-bezier(.22,1,.36,1)',fill:'both'});
    try{await dialogAnimation.finished;}catch{return;}
  }
  if(sequence!==dialogSequence)return;review.close();dialogAnimation?.cancel();
  const target=returnFocus?.isConnected?returnFocus:main.querySelector('h1');if(target){if(target.tagName==='H1')target.tabIndex=-1;target.focus({preventScroll:true});}
}
function projectHome(){
  const rows=[['Harbour Letters','2026-10-15'],['The Observatory','2026-10-14']].filter(([name])=>!sample.includes('empty'));
  return `<div class="reading">${heading(t('Studio projects','创作项目'),t('A place for the works you are making.','从这里继续你的创作。'))}<section class="paper"><details class="inline-create"><summary>${t('New project','新建项目')}</summary>${field(t('Project name','项目名称'),`<input id="project-name" name="project-name" autocomplete="off" maxlength="160" placeholder="${t('e.g. Harbour Letters','例如：港湾书简')}">`)}${button(t('Create project','创建项目'),'create-project','primary')}<p class="status" id="create-feedback" role="status"></p></details>${field(t('Search projects','搜索项目'),`<input id="project-search" name="project-search" type="search" autocomplete="off" placeholder="${t('Search by name…','输入项目名称…')}">`)}<div class="project-list" id="project-list">${sample==='loading'?info('Loading projects…','正在加载项目…'):sample==='error'?info('Projects could not be loaded. Your saved work is unchanged. Try again.','项目加载失败，已保存的内容仍在。请重试。',true)+button(t('Try again','重试'),'retry'):rows.length?rows.map(([name,date])=>`<article class="project-row" data-project-name="${name}"><div><h3>${name}</h3><p>${t('Updated','更新于')} <time datetime="${date}">${date}</time></p></div>${button(t('Open project','打开项目'),'open-project','primary')}${details(t('Manage','管理'),button(t('Delete project','删除项目'),'delete-project','quiet danger'))}</article>`).join(''):`<div class="empty"><h2>${t('Your first project starts here','开始你的第一个项目')}</h2><p class="muted">${t('Choose New project to begin. Edits enter review before they are saved.','展开“新建项目”即可开始。编辑内容会先进入审查，再保存。')}</p></div>`}</div></section></div>`;
}
function studioTree(){return `<aside class="paper tree-paper"><h3>${t('Project resources','项目资源')}</h3>${field(t('Filter resources','筛选资源'),`<input type="search" name="resources" autocomplete="off" placeholder="${t('Filter resources…','筛选资源…')}">`)}<div class="tree">${['Overview','Actors','EntryPoints','UI','Assets','Source'].map(name=>button(t(name,{'Overview':'概览','Actors':'角色','EntryPoints':'起点','UI':'UI','Assets':'素材','Source':'源码'}[name]),name==='Source'?'go-files':'go-agent','quiet')).join('')}<small>Harbour Keeper</small></div></aside>`;}
function mobilePanels(){return `<nav class="mobile-panels" aria-label="${t('Studio panels','创作面板')}">${[['project',t('Project','项目')],['editor',t('Editor','编辑')],['preview',t('Preview','预览')],['ai','AI'],['more',t('More','更多')]].map(([id,label])=>`<button type="button" data-panel="${id}" aria-pressed="${id==='editor'}">${label}</button>`).join('')}</nav>`;}
function agent(){
  const phase=sample==='conflict'?'conflict':sample==='error'?'repair':agentPhase;
  const status={draft:t('New task','新任务'),planned:t('Plan ready','计划已准备'),review:t('Ready for review','等待审查'),completed:t('Saved','已保存'),conflict:t('Project version changed','项目版本已更新'),repair:t('Needs correction','需要修改'),taken_over:t('Human takeover','已转为手动处理')}[phase];

  if(view==='backup'){const select=main.querySelector('#restore-mode');if(select)select.value=backupMode;if(backupStep==='running')for(const node of main.querySelectorAll('[data-backup-scope],#restore-mode,[data-action=backup-demo-file],[data-action=backup-demo-export]'))node.disabled=true;}
}
function draftReview(kind){const isFile=kind==='file',draft=isFile?fileDraft:agentIntent;openReview(t('Review changes','审查更改'),`<p>${t('Check the exact proposed contents before applying.','保存前，请先检查建议内容。')}</p><p class="technical">baseRevision a73c2e8 · ${isFile?'source.write':'project.save'}</p><pre>${esc(draft)}</pre>${sample==='conflict'?info('Current version differs from the proposal’s base. This preview offers no forced overwrite or automatic merge.','当前版本与提议基线不同，此稿不提供强制覆盖或自动合并。',true):''}${info('Design preview. A real request already sent cannot be undone by closing this paper.','设计预览。正式请求一旦发出，关闭这张纸不会撤销提交。')}<div class="actions">${button(t('Keep editing','继续编辑'),'review-cancel')}${button(t('Apply example','应用示例'),isFile?'file-apply':'agent-apply','primary',sample==='conflict')}</div>`);}
document.addEventListener('keydown',()=>{inputMode='keyboard';},true);document.addEventListener('pointerdown',()=>{inputMode='pointer';},true);
document.querySelector('#language').addEventListener('change',event=>{locale=event.target.value;render();});document.querySelector('#view').addEventListener('change',event=>{view=event.target.value;sample='default';render();});document.querySelector('#sample').addEventListener('change',event=>{sample=event.target.value;render();});
document.querySelector('#close-review').addEventListener('click',closeReview);review.addEventListener('cancel',event=>{event.preventDefault();closeReview();});
document.addEventListener('input',event=>{if(event.target.id==='file-source')fileDraft=event.target.value;if(event.target.id==='agent-intent')agentIntent=event.target.value;if(event.target.id==='project-search')for(const row of main.querySelectorAll('[data-project-name]'))row.hidden=!row.dataset.projectName.toLowerCase().includes(event.target.value.trim().toLowerCase());});
document.addEventListener('change',event=>{if(event.target.id==='restore-mode'){backupMode=event.target.value;}if(event.target.dataset.backupScope){const id=event.target.dataset.backupScope;if(event.target.checked)backupScope.add(id);else backupScope.delete(id);if(backupStep!=='empty'){backupStep=backupScope.size?'ready':'error';render();}}if(event.target.dataset.plugin)toast('Example setting saved. Reload would apply the existing plugin change.','示例设置已保存。正式插件修改会在刷新后生效。');});
document.addEventListener('click',event=>{
  const target=event.target.closest('button');if(!target||target.disabled)return;
  if(target.dataset.scene){view='previous';render();main.querySelector('iframe').src='discussion-preview-v0.6.html#'+target.dataset.scene;return;}
  if(target.dataset.view){view=target.dataset.view;sample='default';render();return;}
  if(target.dataset.panel){const pane=target.dataset.panel;for(const button of main.querySelectorAll('[data-panel] button'))button.setAttribute('aria-pressed',String(button.dataset.panel===pane));main.querySelector('.studio').dataset.panel=pane==='more'?'ai':pane==='preview'?'editor':pane;return;}
  if(target.dataset.backupPanel){backupPanel=target.dataset.backupPanel;render();return;}
  const action=target.dataset.action;
  if(action==='backup-export'||action==='backup-restore'){view='backup';backupPanel='archive';render();return;}
  if(action==='backup-demo-file'){backupStep=sample==='error'||!backupScope.size?'error':'ready';render();return;}
  if(action==='backup-demo-start'){openReview(t('Confirm restore','确认恢复'),info('A recovery point is created first. Merge uses the archive version for conflicting paths; replacement and full restore replace their selected scope.','开始前会先保存恢复点。合并时同名文件使用备份版本；替换和完整恢复会替换所选范围。')+button(t('Keep existing data','保留现有数据'),'review-cancel')+button(t('Start example restore','开始示例恢复'),'backup-demo-confirm','primary'));return;}
  if(action==='backup-demo-confirm'){backupStep='running';closeReview();render();return;}
  if(action==='backup-demo-cancel'){backupStep='cancelled';render();return;}
  if(action==='backup-demo-finish'){backupStep='complete';render();return;}
  if(action?.startsWith('backup-demo-')){toast('Prototype feedback only. Existing product services own these actions.','仅为原型反馈，正式操作仍使用已有服务。');return;}
  if(action==='retry'){sample='default';render();}
  if(action==='open-project'||action==='go-agent'){view='agent';render();}
  if(action==='go-files'){view='files';render();}
  if(action==='create-project'){const name=main.querySelector('#project-name');if(!name.value.trim()){name.setAttribute('aria-invalid','true');name.focus();document.querySelector('#create-feedback').textContent=t('Enter a project name.','请填写项目名称。');}else toast('Example project created. Product creation uses the real Studio service.','示例项目已创建，正式创建使用真实 Studio 服务。');}
  if(action==='delete-project')openReview(t('Delete project','删除项目'),info('Project source and edit history would be permanently deleted. Installed works, sessions and saves remain.','此操作会永久删除项目源码和编辑历史。已安装作品、会话和存档仍会保留。')+button(t('Cancel','取消'),'review-cancel')+button(t('Deletion disabled in preview','预览中不执行删除'),'none','danger',true));
  if(action==='agent-create'){agentPhase='planned';render();}
  if(action==='agent-continue'){agentPhase='review';render();toast('Example review is ready; the project is not committed.','示例提议已进入审查，项目尚未提交。');}
  if(action==='agent-inspect'||action==='agent-commit')draftReview('agent');
  if(action==='agent-takeover'){agentPhase='taken_over';render();}
  if(action==='agent-new'){agentPhase='draft';sample='default';render();}
  if(action==='file-review')draftReview('file');
  if(action==='file-reload')openReview(t('Reload source','重新加载源码'),info('Reload discards the current draft only after you confirm. Cancel keeps its exact contents.','确认后才会舍弃当前草稿并重新加载。取消会保留原文。')+button(t('Keep draft','保留草稿'),'review-cancel')+button(t('Confirm reload example','确认重新加载示例'),'file-confirm-reload','primary'));
  if(action==='file-confirm-reload'){fileDraft='<template><main node-id="root"><p node-id="welcome">The harbour is quiet.</p></main></template>';closeReview();render();}
  if(action==='file-assets')toast('Assets file operations share a Workspace with manifest and reference updates.','素材文件操作会和清单、引用更新一同进入工作区。');
  if(action==='review-cancel')closeReview();
  if(action==='agent-apply'||action==='file-apply'){target.disabled=true;agentPhase='completed';closeReview();render();toast('Example saved receipt: b91e6c4. No actual project was modified.','示例保存回执：b91e6c4。实际项目未被修改。');}
  if(action==='login-register'){loginPhase='register';render();}if(action==='login-recovery'){loginPhase='recovery';render();}if(action==='login-back'){loginPhase='account';render();}
  if(action==='login-submit')toast('Design preview only. Real sign-in uses the existing account service.','仅为设计预览，正式登录使用已有账户服务。');
  if(action==='oauth')toast('This provider must be enabled by the server administrator.','此登录方式需要管理员在服务器中开启。');
  if(action==='account-save')toast('Example profile feedback; no account data changed.','示例资料反馈，未修改账户数据。');
  if(action==='account-password'||action==='account-signout'||action?.startsWith('backup-'))openReview(t('Review account action','确认账户操作'),info('This represents the existing account or Backup & Sync controller. No password, account, backup destination or file is changed here.','此处代表已有账户或备份与同步流程，不会修改密码、账户、备份目标或文件。')+button(t('Return','返回'),'review-cancel'));
  if(action?.startsWith('plugin-'))toast('Settings and scope are owned by the existing plugin controller.','设置和使用范围仍由已有插件控制器管理。');
  if(action?.startsWith('media-'))openReview(action==='media-use'?t('Use this version','使用此版本'):t('Candidate details','候选详情'),info('The actual approval binds the selected candidate and task version. Request cost remains unknown unless the service reports it.','正式批准会绑定所选候选和任务版本。服务未报告时，请求费用保持未知。')+technical({candidate:'example-1',task:'illustration-example',action,source:'design-preview'})+button(t('Return to candidates','返回候选列表'),'review-cancel'));
  if(action?.startsWith('host-'))toast('Host controls remain available through the existing work interface contract.','宿主控制继续沿用已有作品界面合同。');
});
render();
</script>
</body>
</html>
