function openReview(title,body){
  const paper=review.querySelector('.dialog-paper'), alreadyOpen=review.open;
  const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const from=alreadyOpen?{opacity:getComputedStyle(paper).opacity,transform:getComputedStyle(paper).transform}:{opacity:0,transform:reduced?'none':'translateY(12px)'};
  const sequence=++dialogSequence;dialogAnimation?.cancel();if(!alreadyOpen)returnFocus=document.activeElement;
  document.querySelector('#review-title').textContent=title;document.querySelector('#review-body').innerHTML=body;document.querySelector('#close-review').textContent=t('Close','关闭');
  if(!alreadyOpen)review.showModal();
  if(inputMode!=='keyboard'){
    dialogAnimation=paper.animate([from,{opacity:1,transform:'none'}],{duration:reduced?100:240,easing:'cubic-bezier(.22,1,.36,1)',fill:'both'});
    dialogAnimation.finished.then(()=>{if(sequence===dialogSequence)dialogAnimation?.cancel();}).catch(()=>{});
  }
  document.querySelector('#close-review').focus();
}
async function closeReview(){
  const paper=review.querySelector('.dialog-paper'),sequence=++dialogSequence;
  const from={opacity:getComputedStyle(paper).opacity,transform:getComputedStyle(paper).transform};dialogAnimation?.cancel();
  if(inputMode!=='keyboard'){
    const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
    dialogAnimation=paper.animate([from,{opacity:0,transform:reduced?'none':'translateY(12px)'}],{duration:reduced?100:180,easing:'cubic-bezier(.22,1,.36,1)',fill:'both'});
    try{await dialogAnimation.finished;}catch{return;}
  }
  if(sequence!==dialogSequence)return;review.close();dialogAnimation?.cancel();
  const target=returnFocus?.isConnected?returnFocus:main.querySelector('h1');if(target){if(target.tagName==='H1')target.tabIndex=-1;target.focus({preventScroll:true});}
}
