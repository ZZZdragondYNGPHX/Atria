<div class="storageInspectorContainer flex-container flexFlowColumn">
    <div class="storageInspectorHeader flex-container alignItemsCenter spaceBetween">
        <nav class="storageInspectorBreadcrumbs flex-container alignItemsCenter"></nav>
        <div class="flex-container alignItemsCenter">
            <button type="button" class="storageInspectorCreateButton menu_button menu_button_icon displayNone" title="Add" aria-label="Add" data-i18n="[title]Add;[aria-label]Add">
                <i class="fa-fw fa-solid fa-plus"></i>
            </button>
            <button type="button" class="storageInspectorRefreshButton menu_button menu_button_icon" title="Refresh" aria-label="Refresh" data-i18n="[title]Refresh;[aria-label]Refresh">
                <i class="fa-fw fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </div>

    <div class="storageInspectorQuota flex-container alignItemsCenter">
        <span class="storageInspectorQuotaUsed"></span>
        <span> / </span>
        <span class="storageInspectorQuotaTotal"></span>
    </div>

    <div class="storageInspectorStackedBar"></div>
    <div class="storageInspectorLegend flex-container flexWrap"></div>

    <div class="storageInspectorList flex-container flexFlowColumn flexNoGap"></div>

    <div class="storageInspectorLoading displayNone">
        <span data-i18n="Loading…">Loading…</span>
    </div>
    <div class="storageInspectorEmpty displayNone">
        <span data-i18n="No data in this category.">No data in this category.</span>
    </div>
    <div class="storageInspectorError displayNone">
        <div class="storageInspectorErrorMessage"></div>
        <button type="button" class="storageInspectorRetryButton menu_button">
            <span data-i18n="Retry">Retry</span>
        </button>
    </div>
</div>
