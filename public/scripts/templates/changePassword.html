<form action="javascript:void(0);" class="flex-container flexFlowColumn">
    <div class="currentPasswordBlock">
        <label data-i18n="Current Password:" for="account-current-password">Current Password:</label>
        <input type="password" id="account-current-password" name="current" class="text_pole" placeholder="[ No password ]" data-i18n="[placeholder][ No password ]" autocomplete="current-password">
    </div>
    <div class="newPasswordBlock">
        <label data-i18n="New Password:" for="account-new-password">New Password:</label>
        <input type="password" id="account-new-password" name="password" class="text_pole" placeholder="[ No password ]" data-i18n="[placeholder][ No password ]" autocomplete="new-password">
    </div>
    <div class="confirmPasswordBlock">
        <label data-i18n="Confirm New Password:" for="account-confirm-password">Confirm New Password:</label>
        <input type="password" id="account-confirm-password" name="confirm" class="text_pole" placeholder="[ No password ]" data-i18n="[placeholder][ No password ]" autocomplete="new-password">
    </div>
</form>
