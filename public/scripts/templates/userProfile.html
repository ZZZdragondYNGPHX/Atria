<section class="atria-account-profile">
    <header class="atria-account-identity">
        <div class="atria-account-avatar">
            <div class="avatar"><img src="img/ai4.png" alt="Account avatar" width="80" height="80" data-i18n="[alt]Account avatar"></div>
            <div class="atria-account-avatar-actions">
                <button type="button" class="userAvatarChange right_menu_button" title="Set your custom avatar." aria-label="Set your custom avatar" data-i18n="[aria-label]Set your custom avatar"><i class="fa-solid fa-image" aria-hidden="true"></i></button>
                <button type="button" class="userAvatarRemove right_menu_button" title="Remove your custom avatar." aria-label="Remove your custom avatar" data-i18n="[aria-label]Remove your custom avatar"><i class="fa-solid fa-trash" aria-hidden="true"></i></button>
            </div>
            <form><input type="file" class="avatarUpload" accept="image/*" hidden></form>
        </div>
        <div class="atria-account-identity-copy">
            <h2 class="userName"></h2>
            <p class="userHandle"></p>
            <span class="userRole"></span>
            <button type="button" data-require-accounts class="userChangeNameButton menu_button" data-i18n="Change display name">Change display name</button>
        </div>
    </header>
    <div class="accountsDisabledHint" style="display:none"><span data-i18n="Local account mode">Local account mode</span></div>
    <section class="atria-account-group">
        <h3 data-i18n="Account Info">Account Info</h3>
        <dl class="atria-account-facts">
            <div><dt data-i18n="Created:">Created:</dt><dd class="userCreated"></dd></div>
            <div><dt data-i18n="Password:">Password:</dt><dd><span class="hasPassword" data-i18n="Password protected">Password protected</span><span class="noPassword" data-i18n="No password set">No password set</span></dd></div>
        </dl>
        <button type="button" data-require-accounts class="userChangePasswordButton menu_button atria-account-row"><span data-i18n="Change Password">Change Password</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
    </section>
    <section class="atria-account-group">
        <h3 data-i18n="Data & recovery">Data & recovery</h3>
        <div class="atria-account-rows">
            <button type="button" class="userSettingsSnapshotsButton menu_button atria-account-row"><span data-i18n="Settings Snapshots">Settings Snapshots</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
            <button type="button" class="userBackupSyncButton menu_button atria-account-row"><span data-i18n="Backup & sync">Backup & sync</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
            <button type="button" class="userStorageManagementButton menu_button atria-account-row"><span data-i18n="Storage management">Storage management</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
        </div>
    </section>
    <details class="atria-account-advanced" data-atria-account-advanced="true">
        <summary data-i18n="Danger Zone">Danger Zone</summary>
        <p data-i18n="Reset actions cannot be undone. Back up your data first.">Reset actions cannot be undone. Back up your data first.</p>
        <div class="atria-account-rows">
            <button type="button" class="userResetSettingsButton menu_button atria-account-row"><span data-i18n="Reset Settings">Reset Settings</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
            <button type="button" class="userResetAllButton menu_button atria-account-row"><span data-i18n="Reset Everything">Reset Everything</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
        </div>
    </details>
</section>
