<div class="storageManagementCenter flex-container flexFlowColumn flexNoGap">
    <h3 class="marginBot5">存储管理</h3>
    <div class="menu_button_note marginBot10">统一管理账户服务端数据与当前浏览器本地数据。可用操作由每项资源的安全能力决定。</div>
    <div class="storageManagementTabs flex-container flexGap5">
        <button type="button" class="menu_button storageManagementTab active" data-tab="server">
            <i class="fa-fw fa-solid fa-server"></i><span>服务器数据</span>
        </button>
        <button type="button" class="menu_button storageManagementTab" data-tab="browser">
            <i class="fa-fw fa-solid fa-hard-drive"></i><span>浏览器数据</span>
        </button>
    </div>
    <section class="storageManagementSection" data-panel="server">
        <div class="flex-container alignItemsCenter spaceBetween marginBot10">
            <div class="menu_button_note flex1">文本资源会在保存前校验并生成恢复点；敏感凭据和数据库文件只显示元信息。</div>
            <button type="button" class="menu_button storageRecoveryRefresh"><i class="fa-fw fa-solid fa-clock-rotate-left"></i>最近恢复点</button>
        </div>
        <div class="storageRecoveryList displayNone marginBot10"></div>
        <div class="storageManagementServerMount storageManagementMount"></div>
    </section>
    <section class="storageManagementSection displayNone" data-panel="browser">
        <div class="storageManagementBrowserMount storageManagementMount"></div>
    </section>
</div>
