<div class="storageManagementCenter flex-container flexFlowColumn flexNoGap">
    <h3 class="marginBot5"><span data-i18n="Storage management">Storage management</span></h3>
    <div class="menu_button_note marginBot10"><span data-i18n="Manage account data on the server and in this browser. Available actions depend on each resource.">Manage account data on the server and in this browser. Available actions depend on each resource.</span></div>
    <div class="storageManagementTabs flex-container flexGap5">
        <button type="button" class="menu_button storageManagementTab active" data-tab="server">
            <i class="fa-fw fa-solid fa-server" aria-hidden="true"></i><span><span data-i18n="Server data">Server data</span></span>
        </button>
        <button type="button" class="menu_button storageManagementTab" data-tab="browser">
            <i class="fa-fw fa-solid fa-hard-drive" aria-hidden="true"></i><span><span data-i18n="Browser data">Browser data</span></span>
        </button>
    </div>
    <section class="storageManagementSection" data-panel="server">
        <div class="flex-container alignItemsCenter spaceBetween marginBot10">
            <div class="menu_button_note flex1"><span data-i18n="Text edits are validated and a recovery point is saved first. Credentials and database files show metadata only.">Text edits are validated and a recovery point is saved first. Credentials and database files show metadata only.</span></div>
            <button type="button" class="menu_button storageRecoveryRefresh"><i class="fa-fw fa-solid fa-clock-rotate-left" aria-hidden="true"></i><span data-i18n="Recent recovery points">Recent recovery points</span></button>
        </div>
        <div class="storageRecoveryList displayNone marginBot10"></div>
        <div class="storageManagementServerMount storageManagementMount"></div>
    </section>
    <section class="storageManagementSection displayNone" data-panel="browser">
        <div class="storageManagementBrowserMount storageManagementMount"></div>
    </section>
</div>
