document.addEventListener('click',e=>{const b=e.target.closest('button,a[data-nav],a[data-category]');if(!b||b.disabled)return;if(b.tagName==='A'){if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();}if(b.matches('.demo-trigger'))return openScenarios();if(b.dataset.scope){if(b.dataset.scope===S.scope)return;S.scope=b.dataset.scope;S.refreshToken++;S.refreshing=false;S.preview=null;closeDrawer(true);navigate('overview');announce(S.scope==='server'?'已切换到服务器账户':'已切换到当前浏览器');return}if(b.dataset.nav)return navigate(b.dataset.nav);if(b.dataset.category)return navigate('category',b.dataset.category);if(b.dataset.detail){const item=S.items.find(x=>x.id===b.dataset.detail);if(item)openDetail(item);return}if(b.dataset.recovery){const item=S.recovery.find(x=>x.id===b.dataset.recovery);if(item)openDetail(item,true);return}if(b.dataset.inspect)return openDetail({id:'technical'},false,b.dataset.inspect);if(b.dataset.mode){S.mode=b.dataset.mode;S.refreshToken++;S.refreshing=false;navigate('overview',undefined,false);openScenarioSelection();return}if(b.dataset.page){S.page=Number(b.dataset.page);rerenderItems();$('#page-select')?.focus({preventScroll:true});return}if(b.dataset.stop){const t=S.tasks.find(t=>t.id===b.dataset.stop);if(t){t.stopRequested=true;updateTask(t);announce('已请求停止，将在完整对象边界结束后续处理')}return}if(b.dataset.retry){const t=S.tasks.find(t=>t.id===b.dataset.retry);if(t)openPreview(t.items.slice(t.done),t.action,'history');return}if(b.dataset.detailAction){const d=S.detail,act=b.dataset.detailAction;if(act==='business'){toast('正式接入时打开现有业务工作区');return}closeDrawer(true);openPreview([d],act==='remove'?(S.scope==='browser'?'purge':'trash'):act,d.recovery?'recovery':'category');return}
 const a=b.dataset.action;if(!a)return;if(['overview','suggestions','recovery'].includes(a))return navigate(a);if(a==='refresh')return refresh();if(a==='clear-search'){S.query='';$('#search').value='';rerenderItems();$('#search').focus();return}if(a==='clear-selection'){S.selected.clear();rerenderItems();$('#page-select')?.focus();return}if(a==='select-filtered'){filteredItems().forEach(x=>S.selected.add(x.id));rerenderItems();announce(`已选择全部筛选结果 ${S.selected.size} 项`);return}if(a==='preview-selected')return openPreview(S.items.filter(x=>S.selected.has(x.id)),S.scope==='browser'?'purge':'trash');if(a==='preview-safe'){const checked=$$('.safe-check:checked').map(c=>c.dataset.safe);openPreview([{id:'runtime',name:'已过期的续接记录 · 8 条',size:12},{id:'gc',name:'隔离期已结束的上传残留 · 32 项',size:1258}].filter(x=>checked.includes(x.id)),'safe');return}if(a==='back-preview'){const back=S.preview?.back||'overview';S.preview=null;navigate(back);return}if(a==='execute')return confirmExecute();if(a.startsWith('manual-'))return navigate('category',a.slice(7));if(a==='browser-candidates')return navigate('category','browser-cache');if(a==='export'){toast('草稿演示：正式入口复用现有账户备份导出');return}});
function openScenarioSelection(){$$('[data-mode]').forEach(b=>{const active=b.dataset.mode===S.mode;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',active)});announce('已切换为'+scenarios.find(x=>x[0]===S.mode)[1])}
document.addEventListener('input',e=>{if(e.target.id==='search'){if(e.isComposing)return;S.query=e.target.value;S.page=1;rerenderItems()}});
document.addEventListener('compositionend',e=>{if(e.target.id==='search'){S.query=e.target.value;S.page=1;rerenderItems()}});
document.addEventListener('change',e=>{const n=e.target;if(n.id==='sort'){S.sort=n.value;S.page=1;rerenderItems()}if(n.classList.contains('item-check')){const had=S.selected.size;if(n.checked)S.selected.add(n.dataset.id);else S.selected.delete(n.dataset.id);syncSelection();if(!had)animateSelection();announce(`已选 ${S.selected.size} 项`)}if(n.id==='page-select'){const had=S.selected.size;filteredItems().slice((S.page-1)*5,S.page*5).forEach(x=>n.checked?S.selected.add(x.id):S.selected.delete(x.id));rerenderItems();$('#page-select')?.focus({preventScroll:true});if(!had)animateSelection();announce(`已选 ${S.selected.size} 项`)}if(n.classList.contains('safe-check')){const count=$$('.safe-check:checked').length,size=$$('.safe-check:checked').reduce((sum,x)=>sum+(x.dataset.safe==='runtime'?12:1258),0);$('#safe-summary').textContent=`已选择 ${count} 组 · ${(size/1024).toFixed(2)} GiB`;$('[data-action="preview-safe"]').disabled=!count}});
window.addEventListener('hashchange',()=>{const [v,c]=location.hash.slice(1).split('/');if(v==='preview'&&S.preview){S.view='preview';render();return}if(navItems.some(x=>x[0]===v)||v==='category'){if(S.view!==v||(c&&S.category!==c)){S.view=v;if(c)S.category=c;S.items=makeItems(S.category);S.selected.clear();S.query='';S.page=1;render()}}});
window.addEventListener('resize',()=>{if($('#detail').open){drag=null;drawerAnimation?.cancel();springState=null;$('#detail').style.transform=''}});
const params=new URLSearchParams(location.search);if(params.get('scope')==='browser')S.scope='browser';S.query=params.get('q')||'';if(['size','name'].includes(params.get('sort')))S.sort=params.get('sort');S.page=Math.max(1,Number.parseInt(params.get('page'),10)||1);
const initial=location.hash.slice(1).split('/');if(navItems.some(x=>x[0]===initial[0])||initial[0]==='category'){S.view=initial[0];if(initial[1])S.category=initial[1]}
const mediaReduced=matchMedia('(prefers-reduced-motion: reduce)');mediaReduced.addEventListener('change',()=>{if(mediaReduced.matches){drawerAnimation?.cancel();springState=null;drag=null;$('#detail').style.transform='';document.getAnimations().forEach(a=>a.cancel())}});
S.items=makeItems(S.category);hydrate();render();
</script>
