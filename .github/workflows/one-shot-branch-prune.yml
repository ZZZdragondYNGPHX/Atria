name: One-shot branch prune

on:
  push:
    branches:
      - chore/cleanup-perf-task-branches
    paths:
      - .github/workflows/one-shot-branch-prune.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every remote branch outside the keep set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          keep_branch() {
            case "$1" in
              main|docs|luker|vanilla|chore/cleanup-perf-task-branches) return 0 ;;
              *) return 1 ;;
            esac
          }

          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" |
            jq -r '.[].name' |
            sort -u |
            while IFS= read -r branch; do
              [ -n "$branch" ] || continue
              if keep_branch "$branch"; then
                echo "Keeping: $branch"
                continue
              fi

              encoded="${branch//\//%2F}"
              echo "Deleting: $branch"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$encoded"
            done
