name: Native UI Session Application Command Targeted

on:
  push:
    branches:
      - feat/native-ui-session-application-command
    paths:
      - 'public/scripts/native/experience/ui/v2-document.js'
      - 'public/scripts/native/experience/ui/v2-runtime.js'
      - 'tests/game-runtime/ui-v2.test.js'
      - 'default/skills/global/atri-native-ui-authoring/references/ui.md'
      - '.github/workflows/native-ui-session-application-command-targeted.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'public/scripts/native/experience/ui/v2-document.js'
      - 'public/scripts/native/experience/ui/v2-runtime.js'
      - 'tests/game-runtime/ui-v2.test.js'
      - 'default/skills/global/atri-native-ui-authoring/references/ui.md'
      - '.github/workflows/native-ui-session-application-command-targeted.yml'

permissions:
  contents: read

jobs:
  targeted:
    name: UI v2 Session Application Command
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build SQLite binding
        run: npm rebuild better-sqlite3 --ignore-scripts=false
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests --no-audit --no-fund
      - name: Syntax check touched runtime
        run: |
          node --check public/scripts/native/experience/ui/v2-document.js
          node --check public/scripts/native/experience/ui/v2-runtime.js
      - name: Run targeted Native regressions
        env:
          ATRIA_DISABLE_MYSQL_TESTS: 1
          ATRIA_DISABLE_POSTGRES_TESTS: 1
        run: >-
          npm run test:unit --prefix tests -- --runInBand
          game-runtime/ui-v2.test.js
          game-runtime/lifecycle-client-p4.test.js
          native/background-task-app-bridge-g2.test.js
          native/lifecycle-contract-p4.test.js
