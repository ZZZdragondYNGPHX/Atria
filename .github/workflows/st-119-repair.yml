name: Repair SillyTavern 1.19.0 chat-info merge

on:
  push:
    branches:
      - chore/sillytavern-1.19.0-adapt
    paths:
      - .github/workflows/st-119-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adaptation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair merged getChatInfo implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/endpoints/chats.js')
          text = path.read_text(encoding='utf-8')
          start_marker = 'export async function getChatInfo(pathToFile, additionalData = {}, withMetadata = false, matcher = null) {'
          end_marker = '\n\nexport const router = express.Router();'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = r'''export async function getChatInfo(pathToFile, additionalData = {}, withMetadata = false, matcher = null) {
              const parsedPath = path.parse(pathToFile);
              const hasMatcher = (typeof matcher === 'function');

              // A chat that is deleted while a scan is running is not an error: treat it like a corrupted chat and move on.
              const chatVanished = () => {
                  console.warn('Chat file was deleted while it was being scanned:', pathToFile);
                  return { match: false };
              };

              let stats;
              try {
                  stats = await fs.promises.stat(pathToFile);
              } catch (error) {
                  if (error.code === 'ENOENT') {
                      return chatVanished();
                  }
                  throw error;
              }

              const chatData = {
                  match: false,
                  file_id: parsedPath.name,
                  file_name: parsedPath.base,
                  file_size: formatBytes(stats.size),
                  chat_items: 0,
                  mes: '[The chat is empty]',
                  last_mes: stats.mtimeMs,
                  sort_time: stats.mtimeMs,
                  ...additionalData,
              };

              if (stats.size === 0) {
                  return chatData;
              }

              return new Promise((res, rej) => {
                  const fileStream = fs.createReadStream(pathToFile);

                  // The file can still disappear between the stat above and the stream opening.
                  fileStream.on('error', (error) => {
                      if (error.code === 'ENOENT') {
                          res(chatVanished());
                          return;
                      }
                      rej(error);
                  });

                  const rl = readline.createInterface({
                      input: fileStream,
                      crlfDelay: Infinity,
                  });

                  // readline re-emits input stream errors; without a listener the emit throws.
                  rl.on('error', (error) => {
                      if (error.code === 'ENOENT') {
                          res(chatVanished());
                          return;
                      }
                      rej(error);
                  });

                  let lastLine;
                  let itemCounter = 0;
                  let hasAnyMatch = false;
                  let matchBuffer = [];
                  rl.on('line', (line) => {
                      if (withMetadata && itemCounter === 0) {
                          const jsonData = tryParse(line);
                          if (jsonData && _.isObjectLike(jsonData.chat_metadata)) {
                              chatData.chat_metadata = jsonData.chat_metadata;
                          }
                      }
                      // Skip matching if any match was already found.
                      if (hasMatcher && !hasAnyMatch && itemCounter > 0) {
                          const jsonData = tryParse(line);
                          if (jsonData) {
                              matchBuffer.push(jsonData.mes || '');
                              if (matcher(matchBuffer)) {
                                  hasAnyMatch = true;
                                  matchBuffer = [];
                              }
                          }
                      }
                      itemCounter++;
                      lastLine = line;
                  });

                  rl.on('close', () => {
                      if (lastLine) {
                          const jsonData = tryParse(lastLine);
                          if (jsonData && (jsonData.name || jsonData.character_name || jsonData.chat_metadata)) {
                              chatData.chat_items = (itemCounter - 1);
                              chatData.mes = jsonData.mes || '[The message is empty]';
                              chatData.last_mes = jsonData.send_date || new Date(Math.round(stats.mtimeMs)).toISOString();
                              chatData.sort_time = normalizeRecentChatSortTime(chatData.last_mes, stats.mtimeMs);
                              chatData.match = hasMatcher ? hasAnyMatch : true;
                              res(chatData);
                          } else {
                              // A truncated write or external edit should not hide an otherwise intact chat.
                              console.warn('Found an invalid or corrupted last line in a chat file:', pathToFile);
                              chatData.chat_items = Math.max(itemCounter - 2, 0);
                              chatData.mes = '[The message is empty]';
                              chatData.match = hasMatcher ? hasAnyMatch : true;
                              res(chatData);
                          }
                      } else {
                          // The file was truncated after stat reported a non-zero size; treat it like an empty chat.
                          res(chatData);
                      }
                  });
              });
          }'''

          new_text = text[:start] + replacement + text[end:]
          path.write_text(new_text, encoding='utf-8')
          PY

          node --check src/endpoints/chats.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/endpoints/chats.js
          git commit -m "fix(upstream): reconcile 1.19 chat info scanning"
          git push origin HEAD:chore/sillytavern-1.19.0-adapt
