name: Native Heavy Frontend Phase 3 Targeted Check

on:
  push:
    branches:
      - package/native-heavy-frontend-reference
    paths:
      - 'packages/native-heavy-frontend-reference/project/**'
      - 'packages/native-heavy-frontend-reference/scenarios/church-day-cycle.json'
      - 'packages/native-heavy-frontend-reference/scenarios/story-turn.json'
      - 'packages/native-heavy-frontend-reference/verify-phase1.mjs'
      - 'packages/native-heavy-frontend-reference/verify-phase2.mjs'
      - 'packages/native-heavy-frontend-reference/verify-phase3.mjs'
      - '.github/workflows/native-heavy-frontend-phase3-targeted.yml'

permissions:
  contents: read

jobs:
  phase3-targeted:
    name: Phase 3 Narrative Knowledge and Story Turn
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Phase 1 shell regression
        run: node packages/native-heavy-frontend-reference/verify-phase1.mjs
      - name: Verify Phase 2 authority lifecycle regression
        run: node packages/native-heavy-frontend-reference/verify-phase2.mjs
      - name: Verify Phase 3 narrative knowledge and recorded story-turn
        run: node packages/native-heavy-frontend-reference/verify-phase3.mjs
