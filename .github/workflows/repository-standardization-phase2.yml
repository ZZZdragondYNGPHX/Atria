name: Repository Standardization Phase 2 Ref Swap

on:
  push:
    branches:
      - refactor/repository-standardization-migration
    paths:
      - .github/workflows/repository-standardization-phase2.yml

permissions:
  contents: write

jobs:
  swap-package-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify protected package source refs
        shell: bash
        run: |
          set -euo pipefail
          expected="b3b6c4f01729325a789c92a15cc6946e1a97603a"
          legacy="$(git ls-remote origin refs/heads/package/native-heavy-frontend-reference | awk '{print $1}')"
          source="$(git ls-remote origin refs/heads/migration-source/native-heavy-frontend-reference | awk '{print $1}')"
          backup="$(git ls-remote origin refs/heads/migration-backup/20260928/package-native-heavy-frontend-reference | awk '{print $1}')"
          test "$legacy" = "$expected"
          test "$source" = "$expected"
          test "$backup" = "$expected"

      - name: Remove only the namespace-conflicting legacy ref
        shell: bash
        run: |
          set -euo pipefail
          git push origin :refs/heads/package/native-heavy-frontend-reference
