name: Native Authoring Platform A2 Checks

on:
  push:
    branches:
      - refactor/atria-native-authoring-platform-product-frontend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-authoring-a2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a2-library-resource:
    name: A2 Library & Resource Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests
      - name: Run A2 focused and adjacent Native regressions
        run: >-
          npm run test:unit --prefix tests -- --runInBand
          native/resource-registry.test.js
          native/library-resource.test.js
          native/resource-graph.test.js
          native/project-composition.test.js
          native/package-build-install.test.js
          native/world-knowledge.test.js
      - name: Run A2 residual guard
        run: node scripts/check-a2-library-resource-architecture.mjs
      - name: Check A2 guard syntax
        run: node --check scripts/check-a2-library-resource-architecture.mjs
      - name: Run A0 hard-cutover guard
        run: node scripts/check-a0-native-authoring-contracts.mjs
      - name: Run A1 authoring backend guard
        run: node scripts/check-a1-native-authoring-backend.mjs
      - name: Run A2 focused lint
        run: >-
          npx eslint
          src/native/authoring/resource-registry.js
          src/native/authoring/library-service.js
          src/native/authoring/resource-graph.js
          src/native/index.js
          tests/native/resource-registry.test.js
          tests/native/library-resource.test.js
          tests/native/resource-graph.test.js
      - name: Run full root lint
        run: npm run lint
