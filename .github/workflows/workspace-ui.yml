name: Workspace UI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "public/scripts/agents/orchestrator/workspace/**"
      - "public/scripts/agents/orchestrator/main.js"
      - "public/scripts/lib/agent-workspace/**"
      - "public/scripts/agents/memory/main.js"
      - "public/scripts/agents/memory/inspector-compute.js"
      - "public/scripts/agents/memory/graph-inspector.js"
      - "public/scripts/agents/orchestrator/i18n.js"
      - "tests/frontend/agent-workspace*.mjs"
      - "tests/agent-runtime/workspace-*.test.js"
      - "tests/e2e/regression/125-orch-preset-switch-persist.e2e.js"
      - "scripts/check-atria-workspace-ui.sh"
      - ".github/workflows/workspace-ui.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Workspace Browser Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Guard Workspace information architecture
        run: bash scripts/check-atria-workspace-ui.sh
      - name: Run Workspace projection smoke
        env:
          ENGINE_BROWSER: chromium
        run: node tests/frontend/agent-workspace.smoke.mjs
      - name: Run Workspace UI smoke
        env:
          ENGINE_BROWSER: chromium
        run: node tests/frontend/agent-workspace-ui.smoke.mjs
      - name: Run Workspace call-count smoke
        env:
          ENGINE_BROWSER: chromium
        run: node tests/frontend/agent-workspace-call-counts.smoke.mjs
      - name: Initialize Atria config for host E2E
        run: npm run init
      - name: Run Workspace binding persistence E2E
        working-directory: tests
        run: npx playwright test e2e/regression/125-orch-preset-switch-persist.e2e.js --project=e2e --workers=1
