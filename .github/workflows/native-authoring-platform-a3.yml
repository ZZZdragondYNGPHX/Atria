name: Native Authoring Platform A3 Checks

on:
  push:
    branches:
      - refactor/atria-native-authoring-platform-product-frontend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-authoring-a3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a3-native-game-runtime:
    name: A3 Native Game Runtime Cutover
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Build SQLite native binding
        run: npm rebuild better-sqlite3 --ignore-scripts=false
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests
      - name: Run A3 focused and adjacent Native regressions
        env:
          ATRIA_DISABLE_MYSQL_TESTS: 1
          ATRIA_DISABLE_POSTGRES_TESTS: 1
        run: >-
          npm run test:unit --prefix tests -- --runInBand
          native/runtime-descriptor.test.js
          native/runtime-http.test.js
          game-runtime/package-loader.test.js
          game-runtime/world-session.test.js
          game-runtime/logic-runtime.test.js
          game-runtime/llm-turn-context.test.js
          game-runtime/llm-memory-bridge.test.js
          game-runtime/llm-runtime.test.js
          game-runtime/llm-turn-controller.test.js
          native/session-core.contract.test.js
          native/session-durability.test.js
          native/session-runtime-http.test.js
          native/session-projection.test.js
          native/world-knowledge.test.js
          native/package-build-install.test.js
      - name: Run A3 runtime authority residual guard
        run: node scripts/check-a3-native-game-runtime-cutover.mjs
      - name: Check A3 guard syntax
        run: node --check scripts/check-a3-native-game-runtime-cutover.mjs
      - name: Run frozen A0/A1/A2 guards
        run: |
          node scripts/check-a0-native-authoring-hard-cutover.mjs
          node scripts/check-a1-native-authoring-backend.mjs
          node scripts/check-a2-library-resource-architecture.mjs
      - name: Run A3 focused lint
        run: >-
          npx eslint
          src/native/runtime-descriptor.js
          src/endpoints/native-session.js
          public/scripts/native/session-runtime.js
          public/scripts/native/experience/index.js
          public/scripts/native/experience/package-loader.js
          public/scripts/native/experience/world/package.js
          public/scripts/native/experience/world/session.js
          public/scripts/native/experience/world/memory-source.js
          public/scripts/native/experience/logic/package.js
          public/scripts/native/experience/logic/runtime.js
          public/scripts/native/experience/llm/declarative-observations.js
          public/scripts/native/experience/llm/runtime.js
          public/scripts/native/experience/llm/turn-context.js
          public/scripts/native/experience/llm/turn-controller.js
          public/scripts/native/experience/llm/memory-bridge.js
          tests/native/runtime-descriptor.test.js
          tests/native/runtime-http.test.js
          tests/game-runtime/package-loader.test.js
          tests/game-runtime/world-session.test.js
          tests/game-runtime/llm-turn-context.test.js
          tests/game-runtime/llm-memory-bridge.test.js
      - name: Run full root lint
        run: npm run lint
