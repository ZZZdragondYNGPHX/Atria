name: Native Heavy Frontend Phase 3 Memory Final Check

on:
  push:
    branches:
      - package/native-heavy-frontend-reference
    paths:
      - '.github/workflows/native-heavy-frontend-phase3-memory-final.yml'

permissions:
  contents: write

jobs:
  phase3-memory-final:
    name: Phase 3 Memory Final Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build SQLite binding
        run: npm rebuild better-sqlite3 --ignore-scripts=false
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests --no-audit --no-fund
      - name: Verify Phase 1 shell regression
        run: node packages/native-heavy-frontend-reference/verify-phase1.mjs
      - name: Verify Phase 2 authority lifecycle regression
        run: node packages/native-heavy-frontend-reference/verify-phase2.mjs
      - name: Verify Phase 3 Package Memory and recorded story-turn
        run: node packages/native-heavy-frontend-reference/verify-phase3.mjs
      - name: Run G3 Memory and G1 G2 targeted regressions
        env:
          ATRIA_DISABLE_MYSQL_TESTS: 1
          ATRIA_DISABLE_POSTGRES_TESTS: 1
        run: >-
          npm run test:unit --prefix tests -- --runInBand
          native/package-turn-memory-bridge-g3.test.js
          native/turn-app-outcome-g1.test.js
          native/background-task-app-bridge-g2.test.js
          memory-graph/hybrid-retrieval.test.js
          memory-graph/source-lifecycle.test.js
      - name: Record targeted result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          printf '{"status":"%s","runId":"%s","headSha":"%s","providerCalls":0}\n' "$JOB_STATUS" "$RUN_ID" "$HEAD_SHA" > .phase3-memory-final-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .phase3-memory-final-result.json
          git commit -m "ci(package): record Phase 3 memory final result" || exit 0
          git push origin HEAD:package/native-heavy-frontend-reference
