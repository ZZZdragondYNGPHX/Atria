name: Native Authoring Platform A4 Checks

on:
  push:
    branches:
      - refactor/atria-native-authoring-platform-product-frontend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-authoring-a4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a4-experience-runtime:
    name: A4 Experience Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Build SQLite native binding
        run: npm rebuild better-sqlite3 --ignore-scripts=false
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests
      - name: Run A4 focused and adjacent Native regressions
        env:
          ATRIA_DISABLE_MYSQL_TESTS: 1
          ATRIA_DISABLE_POSTGRES_TESTS: 1
        run: >-
          npm run test:unit --prefix tests -- --runInBand
          native/frontend-v3.test.js
          native/frontend-presentation.test.js
          native/frontend-bridge-client.test.js
          native/runtime-http.test.js
          game-runtime/ui-host-surfaces.test.js
          game-runtime/ui-full-host.test.js
          native/frontend-conversation.test.js
          game-runtime/ui-surfaces.test.js
          game-runtime/ui-environment.test.js
          native/frontend-bridge.test.js
          game-runtime/package-loader.test.js
          native/runtime-descriptor.test.js
          native/studio-preview-experience.test.js
          native/studio-service.test.js
          game-runtime/world-session.test.js
          game-runtime/logic-runtime.test.js
          game-runtime/llm-turn-context.test.js
          game-runtime/llm-runtime.test.js
          game-runtime/llm-turn-controller.test.js
          native/session-core.contract.test.js
          native/session-durability.test.js
          native/session-runtime-http.test.js
          native/session-projection.test.js
          native/world-knowledge.test.js
          native/package-build-install.test.js
          atria-shell/native-play-host.test.js
      - name: Run A4 Experience Runtime residual guard
        run: node scripts/check-a4-experience-runtime.mjs
      - name: Check A4 guard syntax
        run: node --check scripts/check-a4-experience-runtime.mjs
      - name: Run frozen A0/A1/A2/A3 guards
        run: |
          node scripts/check-a0-native-authoring-hard-cutover.mjs
          node scripts/check-a1-native-authoring-backend.mjs
          node scripts/check-a2-library-resource-architecture.mjs
          node scripts/check-a3-native-game-runtime-cutover.mjs
      - name: Run A4 focused lint
        run: >-
          npx eslint
          src/native/runtime-descriptor.js
          src/native/studio-preview.js
          src/native/authoring/studio-service.js
          public/scripts/native/experience/index.js
          public/scripts/native/experience/package-loader.js
          public/shared/native-frontend-contract.js
          public/scripts/native/frontend/runtime.js
          src/native/frontend/compiler.js
          public/scripts/native/frontend/bridge.js
          public/scripts/native/experience/ui/surfaces.js
          public/scripts/native/experience/ui/host-surfaces.js
          public/scripts/native/frontend/conversation.js
          public/scripts/native/frontend/resources.js
          public/scripts/native/experience/ui/live.js
          public/scripts/native/experience/ui/full-host.js
          public/scripts/atria-shell/native-play-host.js
          tests/native/frontend-v3.test.js
          tests/native/frontend-bridge-client.test.js
          tests/native/runtime-http.test.js
          tests/native/frontend-presentation.test.js
          tests/game-runtime/ui-full-host.test.js
          tests/game-runtime/package-loader.test.js
          tests/native/runtime-descriptor.test.js
          tests/native/studio-preview-experience.test.js
      - name: Run full root lint
        run: npm run lint
