name: Game Runtime R4 Browser Checks

on:
  push:
    branches:
      - refactor/game-runtime-architecture
    paths:
      - "public/scripts/extensions/game-runtime/ui/**"
      - "public/scripts/extensions/game-runtime/manifest.js"
      - "public/scripts/extensions/game-runtime/package-loader.js"
      - "tests/frontend/game-runtime-r4.smoke.mjs"
      - ".github/workflows/game-runtime-r4-browser-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: R4 Desktop Mobile Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run R4 desktop and mobile smoke
        run: node tests/frontend/game-runtime-r4.smoke.mjs
