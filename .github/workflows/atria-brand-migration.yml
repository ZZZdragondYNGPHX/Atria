name: Atria bootstrap brand migration

on:
  push:
    branches:
      - feat/atria-bootstrap
    paths:
      - .github/workflows/atria-brand-migration.yml

permissions:
  contents: write

jobs:
  migrate-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/atria-bootstrap

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebrand Android application identity
        shell: bash
        run: |
          set -euo pipefail

          echo "Legacy Android identifiers before migration:"
          grep -RInI -E 'Luker|luker|com\.luker\.app' android-app             --exclude-dir=build --exclude-dir=.gradle || true

          while IFS= read -r -d '' file; do
            if grep -Iq . "$file"; then
              perl -0pi -e 's/com\.luker\.app/com.atria.app/g; s/Luker/Atria/g; s/luker/atria/g' "$file"
            fi
          done < <(find android-app -type f -not -path '*/build/*' -not -path '*/.gradle/*' -print0)

          while IFS= read -r -d '' path; do
            base="$(basename "$path")"
            dir="$(dirname "$path")"
            newbase="$(printf '%s' "$base" | sed -e 's/Luker/Atria/g' -e 's/luker/atria/g')"
            if [ "$newbase" != "$base" ]; then
              mv "$path" "$dir/$newbase"
            fi
          done < <(find android-app -depth \( -name '*Luker*' -o -name '*luker*' \) -print0)

          echo "Remaining legacy Android identifiers:"
          grep -RInI -E 'Luker|luker|com\.luker\.app' android-app             --exclude-dir=build --exclude-dir=.gradle || true

      - name: Add Atria naming policy
        shell: bash
        run: |
          mkdir -p docs/atria
          cat > docs/atria/NAMING.md <<'EOF'
          # Atria naming policy

          - Product / UI / package identity: `Atria`.
          - New Atria-owned code namespaces: prefer concise `atri_*` names, e.g. `atri_memory`, `atri_agent`, `atri_workspace`.
          - SillyTavern upstream names remain unchanged unless Atria intentionally overrides the behavior.
          - Legacy Luker persisted keys, protocol fields and compatibility-sensitive identifiers may remain until a dedicated migration provides backward compatibility.
          - New code must not introduce new Luker-branded product identifiers.
          EOF

      - name: Commit migration
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No brand migration changes required."
            exit 0
          fi
          git commit -m "refactor: migrate Android product identity to Atria"
          git push origin HEAD:feat/atria-bootstrap
