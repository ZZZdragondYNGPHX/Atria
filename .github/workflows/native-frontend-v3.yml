name: Native Frontend v3

on:
  push:
    branches: [refactor/native-frontend-runtime-v3, main]
    paths: ['src/**', 'public/**', 'default/skills/**', 'tests/**', 'scripts/**', 'package*.json', '.github/workflows/native-frontend-v3.yml']
  pull_request:
    paths: ['src/**', 'public/**', 'default/skills/**', 'tests/**', 'scripts/**', 'package*.json', '.github/workflows/native-frontend-v3.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: native-frontend-v3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Native v3 regression and Hard Cut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3 --ignore-scripts=false
      - run: npm ci --ignore-scripts --prefix tests
      - run: node docker/build-lib.js
      - run: npm run test:unit --prefix tests -- --maxWorkers=2 --testPathPattern='native|game-runtime|atria-shell|memory-graph'
        env:
          ATRIA_DISABLE_MYSQL_TESTS: 1
          ATRIA_DISABLE_POSTGRES_TESTS: 1
      - name: Authority, Studio and Hard Cut guards
        run: |
          for script in scripts/check-native-*.mjs scripts/check-a[0-9]-*.mjs; do node "$script"; done
  browser:
    name: Native v3 Heavy and Studio browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3 --ignore-scripts=false
      - run: npm ci --ignore-scripts --prefix tests
      - run: node tests/node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: node docker/build-lib.js
      - name: Installed Heavy and formal Studio Preview
        env:
          ATRIA_BROWSER_CHANNEL: chromium
        run: |
          node tests/frontend/native-frontend-heavy.smoke.mjs
          node tests/frontend/native-frontend-authoring.smoke.mjs
