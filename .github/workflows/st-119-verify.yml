name: Verify SillyTavern 1.19.0 adaptation

on:
  push:
    branches:
      - chore/sillytavern-1.19.0-adapt

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout adaptation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check for unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.js' '*.cjs' '*.mjs' '*.json' '*.html' '*.css' ':!package-lock.json'; then
            echo 'Unresolved merge markers found.'
            exit 1
          fi

      - name: Check changed JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin custom-release
          mapfile -t files < <(git diff --name-only origin/custom-release...HEAD -- '*.js' '*.cjs' '*.mjs')
          for path in "${files[@]}"; do
            if [ -f "$path" ]; then
              node --check "$path"
            fi
          done

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Lint application
        run: npm run lint

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --ignore-scripts

      - name: Lint tests
        working-directory: tests
        run: npm run lint

      - name: Run unit tests serially
        working-directory: tests
        run: npm run test:unit:serial
