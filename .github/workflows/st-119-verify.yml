name: Verify SillyTavern 1.19.0 adaptation

on:
  push:
    branches:
      - chore/sillytavern-1.19.0-adapt

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 53306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luker
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luker_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U luker -d luker_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    timeout-minutes: 30
    steps:
      - name: Checkout adaptation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check for unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.js' '*.cjs' '*.mjs' '*.json' '*.html' '*.css' ':!package-lock.json'; then
            echo 'Unresolved merge markers found.'
            exit 1
          fi

      - name: Check changed JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin custom-release
          mapfile -t files < <(git diff --name-only origin/custom-release...HEAD -- '*.js' '*.cjs' '*.mjs')
          for path in "${files[@]}"; do
            if [ -f "$path" ]; then
              node --check "$path"
            fi
          done

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Build SQLite native binding
        run: npm rebuild better-sqlite3 --ignore-scripts=false

      - name: Lint application
        run: npm run lint

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --ignore-scripts

      - name: Lint tests
        working-directory: tests
        run: npm run lint

      - name: Run unit tests
        working-directory: tests
        run: npm run test:unit -- --maxWorkers=2

      - name: Build frontend libraries
        run: node docker/build-lib.js
