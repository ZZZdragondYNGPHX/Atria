name: Fix SillyTavern 1.19 MessageFormatter integration

on:
  push:
    branches:
      - chore/sillytavern-1.19.0-adapt
    paths:
      - .github/workflows/st-119-message-formatter-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore upstream MessageFormatter integration points
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('public/script.js')
          script = script_path.read_text(encoding='utf-8')

          if 'MessageFormatter.runStage(' not in script:
              anchor = """        const depth = messageId >= 0 && indexOf !== -1 ? (usableMessages.length - indexOf - 1) : undefined;\n\n        // Always override the character name\n"""
              replacement = """        const depth = messageId >= 0 && indexOf !== -1 ? (usableMessages.length - indexOf - 1) : undefined;\n\n        mes = MessageFormatter.runStage(MessageFormatter.stage.BEFORE_REGEX, mes,\n            { ch_name, isSystem, isUser, messageId, isReasoning },\n        );\n\n        // Always override the character name\n"""
              if anchor not in script:
                  raise SystemExit('BEFORE_REGEX anchor not found')
              script = script.replace(anchor, replacement, 1)

              anchor = """        mes = getRegexedString(mes, regexPlacement, {\n            characterOverride: ch_name,\n            isMarkdown: true,\n            depth: depth,\n        });\n    }\n"""
              replacement = """        mes = getRegexedString(mes, regexPlacement, {\n            characterOverride: ch_name,\n            isMarkdown: true,\n            depth: depth,\n        });\n\n        mes = MessageFormatter.runStage(MessageFormatter.stage.AFTER_REGEX, mes,\n            { ch_name, isSystem, isUser, messageId, isReasoning },\n        );\n    }\n"""
              if anchor not in script:
                  raise SystemExit('AFTER_REGEX anchor not found')
              script = script.replace(anchor, replacement, 1)

              anchor = """        mes = mes.replace(/<code(.*)>[\\s\\S]*?<\\/code>/g, function (match) {\n            return match.replace(/&amp;/g, '&');\n        });\n    }\n\n    if (!power_user.allow_name2_display"""
              replacement = """        mes = mes.replace(/<code(.*)>[\\s\\S]*?<\\/code>/g, function (match) {\n            return match.replace(/&amp;/g, '&');\n        });\n\n        mes = MessageFormatter.runStage(MessageFormatter.stage.AFTER_MARKDOWN, mes,\n            { ch_name, isSystem, isUser, messageId, isReasoning },\n        );\n    }\n\n    if (!power_user.allow_name2_display"""
              if anchor not in script:
                  raise SystemExit('AFTER_MARKDOWN anchor not found')
              script = script.replace(anchor, replacement, 1)
              script_path.write_text(script, encoding='utf-8')

          context_path = Path('public/scripts/st-context.js')
          context = context_path.read_text(encoding='utf-8')
          if "import { MessageFormatter } from './message-formatter.js';" not in context:
              anchor = "import { macros } from './macros/macro-system.js';\n"
              if anchor not in context:
                  raise SystemExit('st-context import anchor not found')
              context = context.replace(anchor, anchor + "import { MessageFormatter } from './message-formatter.js';\n", 1)
              context_path.write_text(context, encoding='utf-8')
          PY

          node --check public/script.js
          node --check public/scripts/st-context.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/script.js public/scripts/st-context.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(upstream): complete MessageFormatter 1.19 integration"
            git push origin HEAD:chore/sillytavern-1.19.0-adapt
          fi
