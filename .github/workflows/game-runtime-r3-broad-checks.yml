name: Game Runtime R3 Broad Checks

on:
  push:
    branches:
      - refactor/game-runtime-architecture
    paths:
      - .github/workflows/game-runtime-r3-broad-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-unit:
    name: Full Node Unit Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests
      - name: Run complete Node unit suite
        run: npm run test:unit:serial --prefix tests
