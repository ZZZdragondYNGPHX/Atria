name: Model Prompt Runtime P0 Checks

on:
  push:
    branches:
      - refactor/atria-model-prompt-settings
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-prompt-runtime-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0-contracts:
    name: P0 Contracts & Architecture Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests

      - name: Run P0 contract and adjacent Native tests
        run: >-
          npm run test:unit --prefix tests -- --runInBand
          native/model-prompt-runtime-contracts.test.js
          native/contracts.test.js
          native/authoring-contracts.test.js
          native/runtime-descriptor.test.js
          native/resource-registry.test.js

      - name: Run P0 architecture residual guard
        run: node scripts/check-p0-model-prompt-runtime-architecture.mjs
      - name: Prove P0 guard detects violations
        run: node scripts/check-p0-model-prompt-runtime-architecture.mjs --self-test
      - name: Check P0 guard syntax
        run: node --check scripts/check-p0-model-prompt-runtime-architecture.mjs

      - name: Run frozen A0-A9 and N9-N10 guards
        run: |
          node scripts/check-a0-native-authoring-hard-cutover.mjs
          node scripts/check-a1-native-authoring-backend.mjs
          node scripts/check-a2-library-resource-architecture.mjs
          node scripts/check-a3-native-game-runtime-cutover.mjs
          node scripts/check-a4-experience-runtime.mjs
          node scripts/check-a5-plugin-skill-platform.mjs
          node scripts/check-a6-native-product-frontend.mjs
          node scripts/check-a7-studio-authoring-ux.mjs
          node scripts/check-a8-project-agent.mjs
          node scripts/check-a9-hard-cutover-product-finalization.mjs
          node scripts/check-n9-native-product-authority.mjs
          node scripts/check-n10-native-hard-cutover.mjs

      - name: Run P0 focused lint
        run: >-
          npx eslint
          src/native/identity.js
          src/native/contracts.js
          src/native/index.js
          src/native/model-prompt-runtime/contracts.js
          src/native/model-prompt-runtime/ports.js
          tests/native/model-prompt-runtime-contracts.test.js
