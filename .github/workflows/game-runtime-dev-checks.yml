name: Game Runtime Dev Checks

on:
  push:
    branches:
      - refactor/game-runtime-architecture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: R0-R5 Focused
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests
      - name: Run focused unit tests
        run: >-
          npm run test:unit --prefix tests --
          --runInBand
          game-runtime/package-manifest.test.js
          game-runtime/package-loader.test.js
          game-runtime/package-transport.test.js
          game-runtime/world-runtime.test.js
          game-runtime/command-registry.test.js
          game-runtime/logic-runtime.test.js
          game-runtime/logic-package.test.js
          game-runtime/logic-rules-integration.test.js
          game-runtime/interpretation-mapping.test.js
          game-runtime/llm-tools.test.js
          game-runtime/llm-intent-resolver.test.js
          game-runtime/llm-event-interpreter.test.js
          game-runtime/llm-memory-bridge.test.js
          game-runtime/llm-memory-ingestion.test.js
          game-runtime/llm-model-runtime-config.test.js
          game-runtime/llm-observation.test.js
          game-runtime/llm-orchestrator-narrative.test.js
          game-runtime/llm-roles.test.js
          game-runtime/llm-turn-controller.test.js
          game-runtime/llm-turn-context.test.js
          game-runtime/llm-runtime.test.js
          game-runtime/r3-exit-matrix.test.js
          game-runtime/r5-exit-matrix.test.js
          game-runtime/r5-ui-button.test.js
          game-runtime/validators.test.js
          game-runtime/rules.test.js
          game-runtime/reducers.test.js
          game-runtime/declarative.test.js
          game-runtime/ui-surfaces.test.js
          game-runtime/ui-selectors.test.js
          game-runtime/ui-component.test.js
          game-runtime/ui-declarative.test.js
          game-runtime/ui-native-components.test.js
          game-runtime/ui-environment.test.js
          game-runtime/ui-full-host.test.js
          game-runtime/ui-immersive.test.js
          game-runtime/ui-host-surfaces.test.js
          game-runtime/ui-package.test.js
          game-runtime/ui-live.test.js
          game-runtime/formula.test.js
          game-runtime/rng.test.js
          game-runtime/world-package.test.js
          game-runtime/world-session.test.js
          game-runtime/world-journal.test.js
          game-runtime/world-branch.test.js
          memory-graph/atomic-facts.test.js
          memory-graph/source-lifecycle.test.js
          memory-graph/history-build.test.js
          memory-graph/hybrid-retrieval.test.js
          regex-engine/game-runtime-boundary.test.js
          regex-engine/lane-semantics.test.js
          card-app.test.js
      - name: Run focused ESLint
        run: >-
          npx eslint
          public/scripts/extensions/game-runtime/*.js
          public/scripts/extensions/game-runtime/logic/*.js
          public/scripts/extensions/game-runtime/llm/*.js
          public/scripts/extensions/game-runtime/ui/*.js
          public/scripts/extensions/game-runtime/world/*.js
          public/scripts/extensions/memory-graph/api.js
          public/scripts/extensions/memory-graph/atomic-facts.js
          public/scripts/extensions/memory-graph/history-build.js
          public/scripts/extensions/memory-graph/main.js
          public/scripts/extensions/memory-graph/source-lifecycle.js
          public/scripts/extensions/memory-graph/source-provenance.js
          public/scripts/extensions/orchestrator/game-runtime-bridge.js
          public/scripts/extensions/orchestrator/main.js
          public/scripts/extensions/regex/engine.js
          src/endpoints/card-app.js
