name: Cleanup merged task branches

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete completed temporary branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin |
              awk '/^(feat|fix|refactor|chore)\//'
          )

          for branch in "${branches[@]}"; do
            [ -n "$branch" ] || continue
            sha="$(git rev-parse "origin/$branch")"
            delete=false

            # Normal merge/rebase where the branch tip is an ancestor of main.
            if git merge-base --is-ancestor "$sha" origin/main; then
              delete=true
            else
              # Squash merges do not retain branch ancestry. Treat a branch as
              # completed only when a merged PR to main used this exact tip SHA.
              merged="$(
                gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls"                   -f state=closed                   -f base=main                   -f head="${GITHUB_REPOSITORY_OWNER}:$branch"                   -f per_page=100 |
                  jq --arg sha "$sha"                     'any(.[]; .merged_at != null and .head.sha == $sha)'
              )"

              if [ "$merged" = "true" ]; then
                delete=true
              fi
            fi

            if [ "$delete" = "true" ]; then
              echo "Deleting completed task branch: $branch"
              git push origin --delete "$branch"
            else
              echo "Keeping active task branch: $branch"
            fi
          done
