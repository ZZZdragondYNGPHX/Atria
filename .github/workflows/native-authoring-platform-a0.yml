name: Native Authoring Platform A0 Checks

on:
  push:
    branches:
      - refactor/atria-native-authoring-platform-product-frontend
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-authoring-a0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a0-contracts:
    name: A0 Contracts & Hard-cutover Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests
      - name: Run A0 contract and adjacent Native regressions
        run: >-
          npm run test:unit --prefix tests -- --runInBand
          native/authoring-contracts.test.js
          native/contracts.test.js
          native/project-composition.test.js
          native/package-container.test.js
          native/package-build-install.test.js
      - name: Run A0 hard-cutover residual guard
        run: node scripts/check-a0-native-authoring-hard-cutover.mjs
      - name: Check A0 guard syntax
        run: node --check scripts/check-a0-native-authoring-hard-cutover.mjs
      - name: Run A0 focused lint
        run: >-
          npx eslint
          src/native/authoring-contracts.js
          src/native/index.js
          tests/native/authoring-contracts.test.js
      - name: Run full root lint
        run: npm run lint
