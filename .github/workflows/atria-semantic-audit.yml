name: Atria Semantic Audit

on:
  push:
    branches:
      - refactor/atria-namespace-migration

permissions:
  contents: write

jobs:
  semantic-audit:
    if: ${{ !contains(github.event.head_commit.message, '[semantic-repair-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair semantic over-replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          workflow = Path(".github/workflows/atria-semantic-audit.yml")

          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts or path == workflow:
                  continue
              raw = path.read_bytes()
              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              original = text
              text = text.replace(
                  "https://github.com/funnycups/Atria",
                  "https://github.com/ZZZdragondYNGPHX/Atria",
              )

              # Atria's API docs live in this repository; the mechanical rename
              # produced links to files/repositories that do not exist.
              text = text.replace(
                  "https://github.com/ZZZdragondYNGPHX/Atria/blob/release/CLAUDE.md",
                  "https://github.com/ZZZdragondYNGPHX/Atria/blob/main/docs/development/extension-api/index.md",
              )

              if path.as_posix().startswith(".github/readme"):
                  text = text.replace(
                      "docs/atria-api-migration.md",
                      "docs/development/extension-api/index.md",
                  )
                  text = text.replace(
                      "/blob/release/docs/development/extension-api/index.md",
                      "/blob/main/docs/development/extension-api/index.md",
                  )

              rel = path.as_posix()
              if rel == ".github/copilot-instructions.md":
                  text = text.replace(
                      "Atria is a SillyTavern-based modified product and the successor product line to Atria.",
                      "Atria is a SillyTavern-based modified product, independent from the former Luker product line while retaining SillyTavern as its upstream foundation.",
                  )
                  text = text.replace(
                      "- `atria` is legacy Atria reference only;",
                      "- `luker` is legacy Luker reference only;",
                  )
                  text = text.replace(
                      "- compatibility-sensitive legacy Atria identifiers may remain until a dedicated migration handles them;",
                      "- active Atria product code must not reintroduce Luker-owned runtime namespaces; historical reference material remains isolated;",
                  )

              if rel == "NEW_FEATURE_PROMPT.md":
                  text = text.replace(
                      "consult `atria` only for legacy/migration context.",
                      "consult `luker` only for legacy/migration context.",
                  )
              if rel == "NEW_BUG_PROMPT.md":
                  text = text.replace(
                      "consult `atria` only for legacy/migration context.",
                      "consult `luker` only for legacy/migration context.",
                  )
              if rel == "README.md":
                  text = text.replace(
                      "- `atria` — legacy Atria reference snapshot; update only when migration/reference work is needed.",
                      "- `luker` — legacy Luker reference snapshot; update only when migration/reference work is needed.",
                  )

              if rel == "scripts/check-atria-namespace.sh":
                  needle = "  ':!FORK_MAINTENANCE.md' \\\n"
                  additions = (
                      "  ':!README.md' \\\n"
                      "  ':!NEW_BUG_PROMPT.md' \\\n"
                      "  ':!NEW_FEATURE_PROMPT.md' \\\n"
                      "  ':!.github/copilot-instructions.md' \\\n"
                  )
                  if additions not in text:
                      text = text.replace(needle, needle + additions)

              if text != original:
                  path.write_text(text, encoding="utf-8")
          PY

      - name: Re-run namespace and semantic gates
        shell: bash
        run: |
          set -euo pipefail
          # The temporary audit workflow contains historical repair literals itself.
          # The permanent namespace guard is re-run by PR CI after this workflow is deleted.
          found=0
          scan() {
            local pattern="$1"
            local label="$2"
            echo "::group::$label"
            if grep -RInI -E "$pattern" .               --exclude-dir=.git               --exclude='atria-semantic-audit.yml'               --exclude='atria-namespace-migration.md'               --exclude='latest-handoff.md'; then
              found=1
            fi
            echo "::endgroup::"
          }
          scan 'successor.{0,80}Atria|Atria.{0,80}successor.{0,80}Atria' 'self-successor'
          scan 'legacy[[:space:]_-]+Atria|legacy.{0,40}`atria`|`atria`.{0,40}legacy' 'legacy-atria'
          scan 'former[[:space:]_-]+Atria|old[[:space:]_-]+Atria' 'former-atria'
          scan 'funnycups/Atria' 'nonexistent-funnycups-atria-links'
          scan '`atria`.{0,80}reference|reference.{0,80}`atria`' 'atria-reference-branch'
          scan 'from[[:space:]]+Atria[[:space:]]+to[[:space:]]+Atria|Atria[[:space:]]*->[[:space:]]*Atria' 'self-migration'
          test "$found" -eq 0

          git diff --check

      - name: Commit semantic repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No semantic repair needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair namespace migration semantics [semantic-repair-generated]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
