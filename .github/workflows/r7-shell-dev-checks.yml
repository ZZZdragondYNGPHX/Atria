name: R7 Shell Dev Checks

on:
  push:
    branches:
      - refactor/atria-game-first-shell-redesign
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: R7D Focused Unit and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests
      - name: Run R7D navigation and shell regression tests
        run: >-
          npm run test:unit --prefix tests --
          --runInBand
          atria-shell
          frontend-bootstrap-order.test.js
          frontend-dom-ready-bootstrap.test.js
          frontend-module-preload.test.js
          frontend-startup-loader.test.js
          frontend-lazy-select2.test.js
          game-runtime/ui-environment.test.js
          game-runtime/ui-host-surfaces.test.js
          game-runtime/ui-native-components.test.js
          game-runtime/ui-package.test.js
          game-runtime/ui-live.test.js
          game-runtime/ui-full-host.test.js
          game-runtime/ui-immersive.test.js
          card-app-loader.test.js
          immersive/controller.test.js
          immersive/structure.test.js
      - name: Lint R7D production modules
        run: >-
          npx eslint
          public/script.js
          public/scripts/textgen-models.js
          public/scripts/select2-actionable-single.js
          public/scripts/horde.js
          public/scripts/tags.js
          public/scripts/loader.js
          public/scripts/power-user.js
          public/scripts/backgrounds.js
          "public/scripts/atria-shell/*.js"
          public/scripts/extensions/game-runtime/ui/host-surfaces.js
          public/scripts/extensions/game-runtime/ui/native-components.js
          public/scripts/extensions/game-runtime/ui/full-host.js
          public/scripts/extensions/game-runtime/ui/live.js
          public/scripts/extensions/game-runtime/ui/package.js
          public/scripts/extensions/card-app/loader.js
          public/scripts/extensions/card-app/index.js
      - name: Lint R7D tests
        working-directory: tests
        run: >-
          npx eslint
          "atria-shell/**/*.js"
          "game-runtime/ui-host-surfaces.test.js"
          "game-runtime/ui-native-components.test.js"
          "game-runtime/ui-package.test.js"
          "game-runtime/ui-live.test.js"
          "game-runtime/ui-full-host.test.js"
          "card-app-loader.test.js"
          "e2e/atria-shell/**/*.e2e.js"
      - name: Verify Atria namespace guard
        run: bash scripts/check-atria-namespace.sh

  browser:
    name: R7D Expanded Medium Compact Navigation Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Build SQLite native binding
        run: npm rebuild better-sqlite3 --ignore-scripts=false
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests
      - name: Build frontend libraries
        run: node docker/build-lib.js
      - name: Initialize test configuration
        run: npm run init
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run R7D shell browser smoke
        working-directory: tests
        run: >-
          npx playwright test
          e2e/atria-shell/01-foundation.e2e.js
          e2e/atria-shell/02-native-actions.e2e.js
          e2e/atria-shell/03-game-surfaces.e2e.js
          e2e/atria-shell/04-navigation.e2e.js
          --project=e2e
          --workers=1
