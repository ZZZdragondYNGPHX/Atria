name: Native Heavy Frontend Phase 2 Targeted Check

on:
  push:
    branches:
      - package/native-heavy-frontend-reference
    paths:
      - 'packages/native-heavy-frontend-reference/project/**'
      - 'packages/native-heavy-frontend-reference/scenarios/church-day-cycle.json'
      - 'packages/native-heavy-frontend-reference/verify-phase1.mjs'
      - 'packages/native-heavy-frontend-reference/verify-phase2.mjs'
      - '.github/workflows/native-heavy-frontend-phase2-targeted.yml'

permissions:
  contents: read

jobs:
  phase2-targeted:
    name: Phase 2 Authority Lifecycle and Scenario
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Phase 1 shell regression
        run: node packages/native-heavy-frontend-reference/verify-phase1.mjs

      - name: Verify Phase 2 authority lifecycle and recorded scenario
        run: node packages/native-heavy-frontend-reference/verify-phase2.mjs
