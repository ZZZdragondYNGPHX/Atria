name: Native UI Temporal Projection Targeted Check

on:
  push:
    branches:
      - feat/native-ui-temporal-projection
    paths:
      - 'public/scripts/native/experience/index.js'
      - 'public/scripts/native/experience/ui/v2-values.js'
      - 'public/scripts/native/experience/ui/v2-runtime.js'
      - 'tests/game-runtime/ui-live.test.js'
      - 'tests/game-runtime/experience-ready-p4.test.js'
      - '.github/workflows/native-ui-temporal-projection-targeted.yml'

permissions:
  contents: read

jobs:
  targeted:
    name: UI Temporal Projection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests --no-audit --no-fund
      - name: Syntax check touched modules
        run: |
          node --check public/scripts/native/experience/index.js
          node --check public/scripts/native/experience/ui/v2-values.js
          node --check public/scripts/native/experience/ui/v2-runtime.js
          node --check tests/game-runtime/ui-live.test.js
          node --check tests/game-runtime/experience-ready-p4.test.js
      - name: Run targeted tests
        run: >-
          npm run test:unit --prefix tests -- --runInBand
          game-runtime/ui-live.test.js
          game-runtime/experience-ready-p4.test.js
