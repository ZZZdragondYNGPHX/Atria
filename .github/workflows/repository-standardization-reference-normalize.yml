name: Normalize repository reference branch names

on:
  push:
    branches:
      - refactor/repository-standardization-migration
    paths:
      - .github/workflows/repository-standardization-reference-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Verify normalized refs and remove superseded bare refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          expected_vanilla="e07c9e2af1b52f6b0f3dedbd5cc47db78f715ccc"
          expected_luker="91ae97aed557be9439317a67d0ec516f7512fe2e"

          actual_vanilla="$(curl -fsSL "${auth[@]}" "${api}/git/ref/heads/reference/vanilla" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          actual_luker="$(curl -fsSL "${auth[@]}" "${api}/git/ref/heads/reference/luker" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"

          test "$actual_vanilla" = "$expected_vanilla"
          test "$actual_luker" = "$expected_luker"

          delete_if_present() {
            local name="$1"
            local code
            code="$(curl -sS -o /tmp/ref.json -w '%{http_code}' "${auth[@]}" "${api}/git/ref/heads/${name}")"
            if [ "$code" = "200" ]; then
              curl -fsSL -X DELETE "${auth[@]}" "${api}/git/refs/heads/${name}"
            elif [ "$code" != "404" ]; then
              cat /tmp/ref.json
              exit 1
            fi
          }

          delete_if_present vanilla
          delete_if_present luker
