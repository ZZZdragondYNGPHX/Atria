name: Atria Semantic Audit 2

on:
  push:
    branches:
      - refactor/atria-namespace-migration

permissions:
  contents: read

jobs:
  semantic-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan semantic over-replacements
        shell: bash
        run: |
          set -uo pipefail
          found=0
          scan() {
            local pattern="$1"
            local label="$2"
            echo "::group::$label"
            if grep -RInEi "$pattern" . \
              --exclude-dir=.git \
              --exclude='atria-semantic-audit-2.yml' \
              --exclude='atria-namespace-migration.md' \
              --exclude='latest-handoff.md'; then
              found=1
            fi
            echo "::endgroup::"
          }
          scan 'funnycups/(atria|Atria)' 'stale-funnycups-atria'
          scan 'Atria.{0,100}legacy|legacy.{0,100}Atria' 'atria-marked-legacy'
          scan 'successor.{0,100}Atria|Atria.{0,100}successor.{0,100}Atria' 'self-successor'
          scan 'Legacy migration source.{0,100}ZZZdragondYNGPHX/Atria' 'wrong-legacy-source'
          scan 'ghcr\.io/funnycups/atria' 'stale-container-image'
          scan '`atria`.{0,100}(legacy|reference)|(legacy|reference).{0,100}`atria`' 'wrong-reference-branch'
          scan 'LEGACY_[A-Z0-9_]+[^\\n]*["'"']atria[_-]' 'legacy-atria-namespace-constant'
          scan '(legacy|fallback|alias).{0,120}atria_[a-z0-9_]+|atria_[a-z0-9_]+.{0,120}(legacy|fallback|alias)' 'legacy-atria-runtime-name'
          exit "$found"
